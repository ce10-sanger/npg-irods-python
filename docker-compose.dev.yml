services:
  irods-clients:
    platform: linux/amd64
    container_name: irods-clients
    image: "ghcr.io/wtsi-npg/ub-22.04-irods-clients-4.3.4:latest"
    command: sleep infinity
    restart: unless-stopped
    environment:
      IRODS_ENVIRONMENT_FILE: "${PWD}/.dev/irods_environment.json"
      IRODS_PASSWORD: "irods"
    volumes:
      - "${PWD}:${PWD}"
    working_dir: "${PWD}"
    depends_on:
      irods-server:
        condition: service_healthy

  app-dev:
    platform: linux/amd64
    image: npg-irods-python-app-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: sleep infinity
    restart: unless-stopped
    environment:
      IRODS_ENVIRONMENT_FILE: "/app/tests/.irods/irods_environment.json"
      IRODS_PASSWORD: "irods"
      NPG_IRODS_TEST_DB_SECTION: "docker"
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./scripts:/app/scripts
      - ./pytest.ini:/app/pytest.ini
      - ./pyproject.toml:/app/pyproject.toml
      - ./coverage:/coverage
    depends_on:
      irods-server:
        condition: service_healthy
      mysql-server:
        condition: service_healthy

  codex-dev:
    platform: linux/amd64
    image: npg-irods-python-codex-dev
    build:
      context: .
      dockerfile: Dockerfile.codex
      args:
        APP_DEV_IMAGE: npg-irods-python-app-dev
    command: sleep infinity
    restart: unless-stopped
    environment:
      CODEX_HOME: "/workspace/.dev/codex-home"
      IRODS_ENVIRONMENT_FILE: "/workspace/tests/.irods/irods_environment.json"
      IRODS_PASSWORD: "irods"
      NPG_IRODS_TEST_DB_SECTION: "docker"
    volumes:
      - .:/workspace
      - ./coverage:/coverage
    working_dir: /workspace
    depends_on:
      irods-server:
        condition: service_healthy
      mysql-server:
        condition: service_healthy
